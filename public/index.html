<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Mode Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e1e;
      --bg-sidebar: #181818;
      --accent: #bb86fc;
      --accent-hover: #9965f4;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --border: #2d2d2d;
      --online: #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; }

    #auth-container { background: var(--bg-card); padding: 30px; border-radius: 12px; width: 320px; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    #auth-container h2 { margin-bottom: 20px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid var(--border); background: #2a2a2a; color: #fff; outline: none; }
    button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; background: var(--accent); color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }
    .toggle-auth { text-align: center; margin-top: 15px; font-size: 0.85em; color: var(--text-muted); cursor: pointer; }

    #app-container { display: flex; width: 90vw; height: 85vh; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
    
    .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); font-size: 1.1em; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .user-profile-btn { cursor: pointer; transition: color 0.2s; }
    .user-profile-btn:hover { color: var(--accent); }

    .section-title { padding: 10px 15px 5px; font-size: 0.75em; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
    .item-list { list-style: none; overflow-y: auto; flex-grow: 1; }
    .item-list li { padding: 10px 15px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-radius: 4px; margin: 2px 8px; }
    .item-list li:hover, .item-list li.active { background: #2a2a2a; }
    .status-indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--online); }

    .friend-box { padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; gap: 5px; }
    .friend-box input { margin: 0; padding: 6px; font-size: 0.85em; }
    .friend-box button { margin: 0; padding: 6px 12px; width: auto; font-size: 0.85em; }

    .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
    .chat-header { padding: 15px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); font-weight: bold; }
    .messages-box { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .message-row { display: flex; gap: 10px; align-items: flex-start; }
    .chat-pfp { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; cursor: pointer; }
    .message-content { display: flex; flex-direction: column; }
    .message-header { display: flex; gap: 8px; align-items: center; }
    .username { font-weight: bold; font-size: 0.9em; cursor: pointer; color: var(--accent); }
    .timestamp { font-size: 0.75em; color: var(--text-muted); }
    .message-text { font-size: 0.95em; margin-top: 2px; }

    .input-box { padding: 15px; border-top: 1px solid var(--border); background: var(--bg-sidebar); display: flex; gap: 10px; }
    .input-box input { margin: 0; }
    .input-box button { width: auto; padding: 0 20px; }

    /* Modal Styling */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .profile-card { background: var(--bg-card); width: 360px; padding: 20px; border-radius: 12px; border: 1px solid var(--border); position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 1.5em; cursor: pointer; width: auto; padding: 0; }
    .profile-header { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
    .profile-header img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
    .profile-title h2 { font-size: 1.2em; }
    .status-badge { font-size: 0.8em; color: var(--online); }
    .profile-body h3 { font-size: 0.9em; margin-bottom: 5px; color: var(--text-muted); }
    .profile-body p { font-size: 0.95em; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTHENTICATION FORM -->
  <div id="auth-container">
    <h2 id="auth-title">Login</h2>
    <input type="text" id="auth-username" placeholder="Username" />
    <input type="password" id="auth-password" placeholder="Password" />
    <button id="auth-btn" onclick="handleAuth()">Login</button>
    <div class="toggle-auth" onclick="toggleAuthMode()">Need an account? Sign Up</div>
  </div>

  <!-- MAIN CHAT APP -->
  <div id="app-container" class="hidden">
    <div class="sidebar">
      <div class="sidebar-header">
        <span id="user-display" class="user-profile-btn" title="Click to view/edit profile">User</span>
      </div>
      
      <div class="friend-box">
        <input type="text" id="friend-input" placeholder="Add friend..." />
        <button onclick="addFriend()">+</button>
      </div>

      <div class="section-title">Channels</div>
      <ul class="item-list">
        <li class="active" onclick="switchTarget('global', false)"># global</li>
      </ul>

      <div class="section-title">Friends</div>
      <ul class="item-list" id="friends-list"></ul>

      <div class="section-title">Online Users</div>
      <ul class="item-list" id="users-list"></ul>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="chat-title"># global</div>
      <div class="messages-box" id="messages"></div>
      
      <div class="input-box">
        <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL POPUP -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="profile-card">
      <button class="close-btn" onclick="closeProfileModal()">&times;</button>
      
      <div class="profile-header">
        <img id="profile-card-avatar" src="https://i.imgur.com/6VBx3io.png" alt="Avatar">
        <div class="profile-title">
          <h2 id="profile-card-username">Username</h2>
          <span id="profile-card-status" class="status-badge">Online</span>
        </div>
      </div>

      <div class="profile-body">
        <h3>About Me</h3>
        <p id="profile-card-bio">Loading bio...</p>
        
        <div id="edit-profile-section" class="hidden">
          <hr style="border-color: #232738; margin: 15px 0;">
          <h3>Edit Profile</h3>
          <input type="text" id="edit-avatar-input" placeholder="Avatar Image URL">
          <input type="text" id="edit-status-input" placeholder="Status (e.g. Gaming, Chilling)">
          <textarea id="edit-bio-input" placeholder="Tell everyone about yourself..." maxlength="150" rows="3" style="width:100%; background:#2a2a2a; color:#fff; border:1px solid var(--border); padding:8px; border-radius:6px; margin-top:8px;"></textarea>
          <button onclick="saveProfileChanges()">Save Profile</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let socket;
    let currentUser = null;
    let currentUserAvatar = 'https://i.imgur.com/6VBx3io.png';
    let currentTarget = 'global';
    let isDM = false;
    let isLogin = true;

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    function toggleAuthMode() {
      isLogin = !isLogin;
      document.getElementById('auth-title').innerText = isLogin ? 'Login' : 'Sign Up';
      document.getElementById('auth-btn').innerText = isLogin ? 'Login' : 'Sign Up';
      document.querySelector('.toggle-auth').innerText = isLogin ? 'Need an account? Sign Up' : 'Have an account? Login';
    }

    async function handleAuth() {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value.trim();

      if (!username || !password) return alert('Fill in all fields');

      const endpoint = isLogin ? '/api/login' : '/api/signup';
      
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) return alert(data.error || 'Authentication failed');

        currentUser = data.username || username;
        await loadMyProfile();

        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        
        const userDisplay = document.getElementById('user-display');
        userDisplay.innerText = `@${currentUser}`;
        userDisplay.onclick = () => openProfileModal(currentUser);

        initSocket();
      } catch (err) {
        alert('Server communication error');
      }
    }

    async function loadMyProfile() {
      try {
        const res = await fetch(`/api/profile/${currentUser}`);
        const data = await res.json();
        if (data.avatar) currentUserAvatar = data.avatar;
      } catch (err) {
        console.error('Error fetching own profile:', err);
      }
    }

    function initSocket() {
      socket = io();

      socket.emit('user_connected', currentUser);

      socket.on('update_online_users', (users) => {
        const list = document.getElementById('users-list');
        list.innerHTML = '';
        users.forEach(user => {
          if (user === currentUser) return;
          const li = document.createElement('li');
          li.innerHTML = `<span onclick="openProfileModal('${escapeHTML(user)}')">${escapeHTML(user)}</span> <div class="status-indicator"></div>`;
          li.onclick = (e) => {
            if (e.target.tagName !== 'SPAN') switchTarget(user, true);
          };
          list.appendChild(li);
        });
      });

      socket.on('update_friends', (friends) => {
        const list = document.getElementById('friends-list');
        list.innerHTML = '';
        if (!friends || friends.length === 0) {
          list.innerHTML = `<li style="color: var(--text-muted); font-size: 0.85em;">No friends added yet</li>`;
          return;
        }
        friends.forEach(friend => {
          const li = document.createElement('li');
          li.innerHTML = `<span>👤 ${escapeHTML(friend)}</span>`;
          li.onclick = () => switchTarget(friend, true);
          list.appendChild(li);
        });
      });

      socket.on('friend_added', (friend) => alert(`You are now friends with ${friend}!`));
      socket.on('friend_error', (msg) => alert(msg));

      socket.on('chat_history', ({ messages }) => {
        const box = document.getElementById('messages');
        box.innerHTML = '';
        if (messages) messages.forEach(appendMessage);
      });

      socket.on('receive_message', (msg) => appendMessage(msg));
    }

    function addFriend() {
      const input = document.getElementById('friend-input');
      const target = input.value.trim();
      if (!target || !socket) return;
      socket.emit('add_friend', target);
      input.value = '';
    }

    function switchTarget(target, dmFlag) {
      currentTarget = target;
      isDM = dmFlag;
      document.getElementById('chat-title').innerText = isDM ? `@${target}` : `# ${target}`;
      document.getElementById('messages').innerHTML = '';

      if (isDM) {
        socket.emit('get_dm_history', currentTarget);
      } else {
        socket.emit('user_connected', currentUser);
      }
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !socket) return;

      socket.emit('send_message', {
        target: currentTarget,
        text,
        isDM,
        avatar: currentUserAvatar
      });

      input.value = '';
    }

    function appendMessage(msg) {
      const box = document.getElementById('messages');
      if (isDM) {
        if (msg.target !== currentTarget && msg.sender !== currentTarget) return;
      } else if (msg.isDM) {
        return;
      }

      const msgElement = document.createElement('div');
      msgElement.classList.add('message-row');

      const avatarUrl = msg.avatar || 'https://i.imgur.com/6VBx3io.png';

      msgElement.innerHTML = `
        <img src="${avatarUrl}" class="chat-pfp" alt="PFP" onclick="openProfileModal('${escapeHTML(msg.sender)}')">
        <div class="message-content">
          <div class="message-header">
            <span class="username" onclick="openProfileModal('${escapeHTML(msg.sender)}')">${escapeHTML(msg.sender)}</span>
            <span class="timestamp">${escapeHTML(msg.timestamp || '')}</span>
          </div>
          <p class="message-text">${escapeHTML(msg.text)}</p>
        </div>
      `;

      box.appendChild(msgElement);
      box.scrollTop = box.scrollHeight;
    }

    async function openProfileModal(targetUsername) {
      const modal = document.getElementById('profile-modal');
      modal.classList.remove('hidden');

      try {
        const res = await fetch(`/api/profile/${targetUsername}`);
        const data = await res.json();

        document.getElementById('profile-card-username').innerText = data.username || targetUsername;
        document.getElementById('profile-card-bio').innerText = data.bio || 'No bio set yet!';
        document.getElementById('profile-card-status').innerText = data.status || 'Online';
        document.getElementById('profile-card-avatar').src = data.avatar || 'https://i.imgur.com/6VBx3io.png';

        const editSection = document.getElementById('edit-profile-section');
        if (targetUsername === currentUser) {
          editSection.classList.remove('hidden');
          document.getElementById('edit-bio-input').value = data.bio || '';
          document.getElementById('edit-status-input').value = data.status || '';
          document.getElementById('edit-avatar-input').value = data.avatar || '';
        } else {
          editSection.classList.add('hidden');
        }
      } catch (err) {
        console.error('Error fetching profile:', err);
      }
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.add('hidden');
    }

    async function saveProfileChanges() {
      const bio = document.getElementById('edit-bio-input').value;
      const status = document.getElementById('edit-status-input').value;
      const avatar = document.getElementById('edit-avatar-input').value;

      try {
        const res = await fetch('/api/profile/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUser, bio, avatar, status })
        });

        const data = await res.json();
        if (data.success) {
          currentUserAvatar = avatar || currentUserAvatar;
          alert('Profile updated successfully!');
          openProfileModal(currentUser);
        }
      } catch (err) {
        console.error('Error saving profile:', err);
      }
    }
  </script>

<script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>

</body>

</body>
</html>
